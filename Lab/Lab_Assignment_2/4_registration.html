<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;padding:30px}
form{background:#fff;padding:25px 30px;border-radius:8px;width:380px;box-shadow:0 2px 8px #0003}
h2{text-align:center}
label{display:block;margin-top:12px;font-weight:bold}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:8px;margin-top:5px;box-sizing:border-box}
.inline label{display:inline;font-weight:normal;margin-right:10px}
button{margin-top:20px;width:100%;padding:10px;background:#2c3e50;color:#fff;border:none;border-radius:4px;cursor:pointer}
</style>
</head>
<body>
<form action="#" method="post">
  <h2>Registration Form</h2>

  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>

  <label>Gender</label>
  <div class="inline">
    <input type="radio" id="male" name="gender" value="male" checked>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>
  </div>

  <label>Hobbies</label>
  <div class="inline">
    <input type="checkbox" id="coding" name="hobby" value="coding">
    <label for="coding">Coding</label>
    <input type="checkbox" id="music" name="hobby" value="music">
    <label for="music">Music</label>
    <input type="checkbox" id="sports" name="hobby" value="sports">
    <label for="sports">Sports</label>
  </div>

  <label for="course">Course</label>
  <select id="course" name="course">
    <option value="">-- Select --</option>
    <option value="btech">B.Tech</option>
    <option value="bca">BCA</option>
    <option value="mca">MCA</option>
    <option value="bsc">B.Sc</option>
  </select>

  <button type="submit">Submit</button>
</form>
</body>
</html>
