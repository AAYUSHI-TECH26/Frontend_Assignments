<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;margin:0;display:flex;align-items:center;justify-content:center}
form{background:#fff;padding:30px;border-radius:10px;width:320px}
h2{text-align:center;margin-top:0}
label{display:block;margin-top:12px;font-weight:bold}
input[type=email],input[type=password]{width:100%;padding:9px;margin-top:5px;box-sizing:border-box}
button{margin-top:18px;width:100%;padding:10px;background:#667eea;color:#fff;border:none;border-radius:4px;cursor:pointer}
p{text-align:center;font-size:14px}
</style>
</head>
<body>
<form action="#" method="post">
  <h2>Login</h2>
  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Enter email" required>
  <label for="pass">Password</label>
  <input type="password" id="pass" name="pass" placeholder="Enter password" required>
  <p><input type="checkbox" id="remember"> <label for="remember" style="display:inline;font-weight:normal">Remember me</label></p>
  <button type="submit">Login</button>
  <p><a href="#">Forgot password?</a></p>
</form>
</body>
</html>
