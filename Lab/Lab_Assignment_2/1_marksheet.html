<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Marksheet</title>
<style>
body{font-family:Arial,sans-serif;margin:30px;background:#f4f6f8}
h1,h3{text-align:center}
table{border-collapse:collapse;width:80%;margin:20px auto;background:#fff}
th,td{border:1px solid #333;padding:10px;text-align:center}
th{background:#2c3e50;color:#fff}
tfoot td{font-weight:bold;background:#ecf0f1}
</style>
</head>
<body>
<h1>XYZ University</h1>
<h3>Student Marksheet - Semester 3</h3>
<p style="text-align:center">Name: <b>AAYU</b> | Roll No: <b>101</b> | Course: <b>B.Tech CSE</b></p>
<table>
  <caption><b>Marks Details</b></caption>
  <thead>
    <tr><th>S.No</th><th>Subject</th><th>Max Marks</th><th>Marks Obtained</th><th>Grade</th></tr>
  </thead>
  <tbody>
    <tr><td>1</td><td>Mathematics</td><td>100</td><td>85</td><td>A</td></tr>
    <tr><td>2</td><td>Physics</td><td>100</td><td>84</td><td>A</td></tr>
    <tr><td>3</td><td>Programming in C</td><td>100</td><td>92</td><td>A+</td></tr>
    <tr><td>4</td><td>English</td><td>100</td><td>79</td><td>B+</td></tr>
    <tr><td>5</td><td>Web Development</td><td>100</td><td>88</td><td>A</td></tr>
  </tbody>
  <tfoot>
    <tr><td colspan="2">Total</td><td>500</td><td>428</td><td></td></tr>
    <tr><td colspan="2">Percentage</td><td colspan="3">85.6%</td></tr>
  </tfoot>
</table>
</body>
</html>
