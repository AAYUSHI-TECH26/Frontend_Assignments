<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopDynamic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <span class="logo">🛍️ ShopDynamic</span>
      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
      </nav>
    </div>
    <button id="cart-btn" class="cart-btn" aria-label="Open cart">
      🛒<span id="cart-count" class="badge">0</span>
    </button>
  </header>

  <main>
    <div id="product-grid" class="grid"></div>
  </main>

  <aside id="cart" class="cart">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button id="cart-close" class="close">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <h3>Cart Total</h3>
      <div class="row"><span>Items:</span><span id="total-items">0</span></div>
      <div class="grand"><span>Grand Total:</span><span id="grand-total">₹ 0</span></div>
      <button class="checkout">Proceed to Checkout</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
