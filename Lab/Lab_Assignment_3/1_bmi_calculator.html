<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BMI Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;padding:40px}
.box{background:#fff;padding:25px;border-radius:8px;width:320px;box-shadow:0 2px 8px #0003}
input{width:100%;padding:8px;margin:6px 0 12px;box-sizing:border-box}
button{width:100%;padding:10px;background:#2c3e50;color:#fff;border:none;border-radius:4px;cursor:pointer}
#result{margin-top:15px;text-align:center;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
  <h2>BMI Calculator</h2>
  <label for="height">Height (cm)</label>
  <input type="number" id="height" placeholder="e.g. 170">
  <label for="weight">Weight (kg)</label>
  <input type="number" id="weight" placeholder="e.g. 65">
  <button onclick="calculateBMI()">Calculate</button>
  <div id="result"></div>
</div>

<script>
function calculateBMI() {
  const h = parseFloat(document.getElementById("height").value);
  const w = parseFloat(document.getElementById("weight").value);
  const result = document.getElementById("result");

  if (!h || !w || h <= 0 || w <= 0) {
    result.style.color = "red";
    result.innerText = "Please enter valid height and weight";
    return;
  }

  const bmi = w / ((h / 100) * (h / 100));
  let category, color;

  if (bmi < 18.5) { category = "Underweight"; color = "#e67e22"; }
  else if (bmi < 25) { category = "Normal"; color = "green"; }
  else { category = "Overweight"; color = "red"; }

  result.style.color = color;
  result.innerHTML = "BMI: " + bmi.toFixed(1) + "<br>Category: " + category;
}
</script>
</body>
</html>
