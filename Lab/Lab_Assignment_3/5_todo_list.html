<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo List</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;padding:40px}
.box{background:#fff;padding:25px;border-radius:8px;width:380px;box-shadow:0 2px 8px #0003}
.row{display:flex;gap:8px}
input[type=text]{flex:1;padding:8px}
button{padding:8px 12px;background:#2c3e50;color:#fff;border:none;border-radius:4px;cursor:pointer}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #ddd}
li span{flex:1;margin-left:10px;cursor:pointer}
li.done span{text-decoration:line-through;color:gray}
li button{background:#e74c3c}
</style>
</head>
<body>
<div class="box">
  <h2>Todo List</h2>
  <div class="row">
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="taskList"></ul>
  <p id="count"></p>
</div>

<script>
const input = document.getElementById("taskInput");
const list = document.getElementById("taskList");
input.addEventListener("keypress", e => { if (e.key === "Enter") addTask(); });

function addTask() {
  const text = input.value.trim();
  if (text === "") { alert("Please enter a task"); return; }

  const li = document.createElement("li");

  const check = document.createElement("input");
  check.type = "checkbox";
  check.onchange = () => { li.classList.toggle("done", check.checked); updateCount(); };

  const span = document.createElement("span");
  span.innerText = text;

  const del = document.createElement("button");
  del.innerText = "Delete";
  del.onclick = () => { li.remove(); updateCount(); };

  li.append(check, span, del);
  list.appendChild(li);
  input.value = "";
  updateCount();
}

function updateCount() {
  const total = list.children.length;
  const done = list.querySelectorAll("li.done").length;
  document.getElementById("count").innerText = total + " tasks, " + done + " completed";
}
</script>
</body>
</html>
