<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Clock</title>
<style>
body{background:#111;color:#0f0;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}
#clock{font-size:80px;letter-spacing:5px}
#date{font-size:24px;margin-top:10px}
button{margin-top:20px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="clock"></div>
<div id="date"></div>
<button onclick="toggleFormat()">Switch 12/24 hour</button>

<script>
let is24 = true;

function pad(n) { return n < 10 ? "0" + n : n; }

function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = pad(now.getMinutes());
  const s = pad(now.getSeconds());
  let suffix = "";

  if (!is24) {
    suffix = h >= 12 ? " PM" : " AM";
    h = h % 12 || 12;
  }

  document.getElementById("clock").innerText = pad(h) + ":" + m + ":" + s + suffix;
  document.getElementById("date").innerText = now.toDateString();
}

function toggleFormat() { is24 = !is24; updateClock(); }

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
