<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup Page</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;padding:30px}
form{background:#fff;padding:25px 30px;border-radius:8px;width:360px;box-shadow:0 2px 8px #0003}
h2{text-align:center}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:8px;margin-top:5px;box-sizing:border-box}
.error{color:red;font-size:13px;min-height:16px}
button{margin-top:18px;width:100%;padding:10px;background:#2c3e50;color:#fff;border:none;border-radius:4px;cursor:pointer}
#success{color:green;text-align:center;margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<form id="signupForm" novalidate>
  <h2>Sign Up</h2>

  <label for="name">Full Name</label>
  <input type="text" id="name">
  <div class="error" id="nameErr"></div>

  <label for="email">Email</label>
  <input type="email" id="email">
  <div class="error" id="emailErr"></div>

  <label for="phone">Phone (10 digits)</label>
  <input type="text" id="phone" maxlength="10">
  <div class="error" id="phoneErr"></div>

  <label for="password">Password</label>
  <input type="password" id="password">
  <div class="error" id="passErr"></div>

  <label for="confirm">Confirm Password</label>
  <input type="password" id="confirm">
  <div class="error" id="confirmErr"></div>

  <button type="submit">Sign Up</button>
  <div id="success"></div>
</form>

<script>
const form = document.getElementById("signupForm");

function setError(id, msg) {
  document.getElementById(id).innerText = msg;
  return msg === "";
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phonePattern = /^[6-9][0-9]{9}$/;
  const passPattern = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/;

  const ok = [
    setError("nameErr", name.length < 3 ? "Name must be at least 3 characters" : ""),
    setError("emailErr", !emailPattern.test(email) ? "Enter a valid email" : ""),
    setError("phoneErr", !phonePattern.test(phone) ? "Enter a valid 10 digit phone number" : ""),
    setError("passErr", !passPattern.test(pass) ? "Min 6 characters with letters and numbers" : ""),
    setError("confirmErr", pass !== confirm ? "Passwords do not match" : "")
  ].every(Boolean);

  document.getElementById("success").innerText = ok ? "Signup successful!" : "";
  if (ok) form.reset();
});
</script>
</body>
</html>
